# Floating popups launched from Waybar click actions.
for_window [app_id="waybar-audio"]  floating enable, resize set 760 560, move position center
for_window [app_id="waybar-network"] floating enable, resize set 900 680, move position center
for_window [app_id="waybar-system"] floating enable, resize set 1100 760, move position center
for_window [app_id="waybar-config"] floating enable, resize set 1100 800, move position center
