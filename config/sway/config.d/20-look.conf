# ============================================================================
#  Look: gaps, borders, one accent colour, the stock bar.
#  Start here. Add eye-candy only once the basics feel right.
# ============================================================================

gaps inner 2
gaps outer 2
smart_gaps on
smart_borders on

default_border pixel 2
default_floating_border pixel 3
titlebar_border_thickness 1
for_window [floating] border pixel 3

# One accent. Change it, reload (Mod4+Shift+r), done.
set $accent #7aa2f7
set $bg     #1a1b26
set $fg     #c0caf5
set $muted  #565f89

client.focused          $accent $accent $bg     $accent $accent
client.focused_inactive $bg     $bg     $fg     $bg     $bg
client.unfocused        $bg     $bg     $fg     $bg     $bg
client.urgent           $bg     #f7768e $bg     #f7768e #f7768e

seat seat0 xcursor_theme Bibata-Modern-Classic 24

# Replaced by the wallpaper picker after Wallust generates the active palette.
include ~/.cache/wallpaper-theme/sway-colors.conf

#Window rules
# 1. Set global transparency for all windows
for_window [class=".*"] opacity 0.85
for_window [app_id=".*"] opacity 0.85

# 2. Force Kitty to remain fully opaque
for_window [app_id="kitty"] opacity 0.90
for_window [app_id="org.vinegarhq.Sober"] opacity 1.0
