# ============================================================================
#  Look: gaps, borders, one accent colour, the stock bar.
#  Start here. Add eye-candy only once the basics feel right.
# ============================================================================

gaps inner 8
gaps outer 4
smart_gaps on
smart_borders on

default_border pixel 2
default_floating_border normal
titlebar_border_thickness 1

# One accent. Change it, reload (Mod4+Shift+r), done.
set $accent #7aa2f7
set $bg     #1a1b26
set $fg     #c0caf5
set $muted  #565f89

client.focused          $accent $accent $bg     $accent $accent
client.focused_inactive $bg     $bg     $fg     $bg     $bg
client.unfocused        $bg     $bg     $fg     $bg     $bg
client.urgent           $bg     #f7768e $bg     #f7768e #f7768e

seat seat0 xcursor_theme Adwaita 24

# swaybar: zero extra packages, always available. Replaced by Waybar in phase 4.
bar {
    position top
    height 26
    status_command while date +'%a %d %b   %H:%M'; do sleep 10; done

    colors {
        background $bg
        statusline $fg
        separator  $muted

        focused_workspace  $accent $accent $bg
        active_workspace   $bg     $bg     $fg
        inactive_workspace $bg     $bg     $muted
        urgent_workspace   #f7768e #f7768e $bg
    }
}
