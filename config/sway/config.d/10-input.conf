# =============================================================================
#  Input — IdeaPad 3 15ALC6
#  Source of truth: swaymsg -t get_inputs
#  Prefer type: matches. They survive new mice, docks and keyboards.
#  Use a device identifier only for per-device tuning.
# =============================================================================

# --- Keyboard: French AZERTY ------------------------------------------------
# Covers the built-in AT keyboard, Power Button, Video Bus, Ideapad buttons,
# and any external keyboard you plug in later.
input type:keyboard {
    xkb_layout fr
    repeat_delay 300
    repeat_rate 40
}

# --- Touchpad: MSFT0001:00 04F3:31BE (1267:12734) ---------------------------
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled                # disable while typing on the built-in keyboard
    middle_emulation enabled
    accel_profile adaptive
}

# --- Logitech M196 (1133:45119) ---------------------------------------------
# Per-device only because you have a mouse AND a touchpad. Delete this block
# if the default pointer feel is fine.
input "1133:45119:Logi_M196_Mouse" {
    accel_profile adaptive
    pointer_accel -0.2
}
