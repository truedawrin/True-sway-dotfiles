# Programs started once with the session.
# Rule: if it is not essential to log in, it does not belong here.

exec ~/.config/wallpaper/wallpaper-theme --restore

# Save clipboard selections for the Mod+V history picker. The helper avoids
# starting duplicate watchers when the Sway config is reloaded.
exec_always ~/.config/sway/scripts/cliphist-start

# GUI password prompts (polkit) — needed by nm-applet, udisks, etc.
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Player controls. The wallpaper helper starts Waybar after generating its CSS.
exec playerctld daemon

exec mako

exec swayidle -w timeout 700 ~/.config/wallpaper/lock-screen
