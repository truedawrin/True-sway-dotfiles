# Programs started once with the session.
# Rule: if it is not essential to log in, it does not belong here.

exec ~/.config/wallpaper/wallpaper-theme --restore

# GUI password prompts (polkit) — needed by nm-applet, udisks, etc.
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

#waybar
exec playerctld daemon
exec waybar

exec swayidle -w timeout 700 /home/dawrin/.config/wallpaper/lock-screen
